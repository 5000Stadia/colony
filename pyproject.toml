[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "colony"
version = "0.1.0"
description = "Keeps one strong Claude Code agent at its best across a long project: a spine in the person's words, checks, a meter, and review only where risk is declared."
requires-python = ">=3.10"

[project.scripts]
colony = "colony.cli:main"

[tool.setuptools]
packages = ["colony"]

[tool.setuptools.package-data]
colony = ["prompts/*.md"]
