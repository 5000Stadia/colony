[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "colony"
version = "0.1.0"
description = "One page to run all your long projects with Claude Code: each project's live console, what it waits on you for, its roadmap, and a monitor agent that can hold the helm."
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
colony = "colony.cli:main"

[tool.setuptools]
packages = ["colony"]

[tool.setuptools.package-data]
colony = ["prompts/*.md", "data/*.json"]
